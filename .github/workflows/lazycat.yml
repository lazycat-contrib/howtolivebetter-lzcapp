name: Sync upstream and publish LazyCat application

on:
  # Daily upstream check; GitHub Actions cron is UTC (CST = UTC+8)
  schedule:
    - cron: "23 15 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "强制发布的版本（留空则按上游最新提交日期自动判断；如 0.20261021）"
        type: string
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - .github/lazycat-action.yml
      - .github/workflows/lazycat.yml
      - build.sh
      - lzc-build.yml
      - lzc-manifest.yml
      - package.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  # 上游没有版本 tag（只有 epub-latest 这种滚动 tag），所以用上游最新提交的日期
  # 当作版本号：0.YYYYMMDD。有新提交就 bump package.yml 并 push，
  # push 事件再触发下方 lazycat 发布。
  sync-upstream:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.version == '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync upstream version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 上游最新提交的日期，形如 2026-10-21
          DATE="$(gh api repos/eternity4719/howtolivebetter/commits --jq '.[0].commit.author.date[0:10]' 2>/dev/null || true)"
          if [ -z "$DATE" ]; then
            echo "no upstream commit found; nothing to do"
            exit 0
          fi
          # 2026-10-21 -> 2026.10.21（合法的 SemVer：三段都是十进制且无前导零）
          YEAR="$(echo "$DATE" | cut -d- -f1)"
          MONTH="$(echo "$DATE" | cut -d- -f2)"
          DAY="$(echo "$DATE" | cut -d- -f3)"
          LATEST="${YEAR}.${MONTH#0}.${DAY#0}"
          CURRENT="$(sed -n 's/^version: *//p' package.yml)"
          echo "upstream date=$DATE version=$LATEST current=$CURRENT"
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "no update needed"
            exit 0
          fi
          # 同一天上游又提交了（版本号必须比线上更新），日期相同时递增末段
          if [ "${CURRENT%.*}" = "$LATEST" ]; then
            LATEST="${LATEST}.$((${CURRENT##*.} + 1))"
          fi
          sed -i "s/^version: .*/version: $LATEST/" package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.yml
          git commit -m "chore: bump to upstream snapshot $LATEST"
          git push

  lazycat:
    # 发布由 sync 产生的 push 触发；手动触发时需显式填版本（避免与 sync 竞态）
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    uses: ca-x/lazycat-github-action/.github/workflows/lazycat.yml@v1
    with:
      operation: auto
      config: .github/lazycat-action.yml
      versioned-release-asset: true
      version: ${{ inputs.version }}
    secrets:
      APPSTORE_URL: ${{ secrets.APPSTORE_URL }}
      APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
      APP_ID: ${{ secrets.APP_ID }}
      PRIVATE_STORE_GROUP_CODES: ${{ secrets.PRIVATE_STORE_GROUP_CODES }}
